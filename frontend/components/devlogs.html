<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="icon" href="../images/pao.jpg">
    <title>Development Blog - Shaiyon's Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-logo">SHA</div>
        <div class="nav-links">
            <a href="../../index.html" class="nav-link">Home</a>
            <a href="../../index.html#about" class="nav-link">About</a>
            <a href="../../index.html#projects" class="nav-link">Projects</a>
            <a href="../../index.html#game" class="nav-link">Game</a>
            <a href="devlogs.html" class="nav-link is-active" aria-current="page" data-nav-item="devlogs">Dev Logs</a>
            <a href="../../index.html#contact" class="nav-link">Contact</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </nav>

    <!-- Blog Header -->
    <section class="blog-header">
        <h1 class="blog-title">Dev Logs</h1>
        <p class="blog-subtitle">Manual portfolio posts first, with meaningful GitHub activity as backup context</p>
    </section>

    <!-- Blog Posts Container -->
    <section class="blog-container">
        <div class="devlog-controls">
            <label class="search-field">
                <span>Search dev logs</span>
                <input id="devlogSearch" type="search" placeholder="Search commits, projects, or tags" autocomplete="off">
            </label>
            <div class="section-toolbar" id="devlogFilters" aria-label="Dev log filters">
                <button class="filter-chip is-active" type="button" data-devlog-type="All">All</button>
                <button class="filter-chip" type="button" data-devlog-type="Manual">Manual</button>
                <button class="filter-chip" type="button" data-devlog-type="GitHub">GitHub</button>
            </div>
            <p class="devlog-count" id="devlogCount">Loading logs</p>
        </div>
        <div class="blog-posts" id="postsContainer" aria-live="polite" aria-busy="true">
            <article class="skeleton-devlog" aria-hidden="true">
                <span class="skeleton-line title"></span>
                <span class="skeleton-line medium"></span>
                <span class="skeleton-line long"></span>
                <span class="skeleton-line long"></span>
                <span class="skeleton-line medium"></span>
                <div class="skeleton-pill-row">
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                </div>
                <div class="skeleton-button-row">
                    <span class="skeleton-button"></span>
                    <span class="skeleton-button"></span>
                </div>
            </article>
            <article class="skeleton-devlog" aria-hidden="true">
                <span class="skeleton-line title"></span>
                <span class="skeleton-line medium"></span>
                <span class="skeleton-line long"></span>
                <span class="skeleton-line long"></span>
                <span class="skeleton-line medium"></span>
                <div class="skeleton-pill-row">
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                </div>
                <div class="skeleton-button-row">
                    <span class="skeleton-button"></span>
                    <span class="skeleton-button"></span>
                </div>
            </article>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p class="copyright">&copy; 2026 Shaiyon. All rights reserved.</p>
    </footer>

    <script src="../js/devlogs.js"></script>
</body>
</html>
