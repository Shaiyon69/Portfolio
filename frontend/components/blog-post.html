<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .blog-post-full {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .back-link::before {
            content: "←";
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }

        .post-not-found {
            text-align: center;
            padding: 4rem 2rem;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-logo">SHA</div>
        <div class="nav-links">
            <a href="../../index.html" class="nav-link">Home</a>
            <a href="../../index.html#about" class="nav-link">About</a>
            <a href="../../index.html#projects" class="nav-link">Projects</a>
            <a href="../../index.html#game" class="nav-link">Game</a>
            <a href="devlogs.html" class="nav-link is-active" aria-current="page" data-nav-item="devlogs">Dev Logs</a>
            <a href="../../index.html#contact" class="nav-link">Contact</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </nav>

    <main>
        <div class="blog-post-full" id="postContainer">
            <div class="skeleton-article" aria-hidden="true">
                <span class="skeleton-line title"></span>
                <span class="skeleton-line medium"></span>
                <div class="skeleton-pill-row">
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                </div>
                <span class="skeleton-line long"></span>
                <span class="skeleton-line long"></span>
                <span class="skeleton-line medium"></span>
                <span class="skeleton-line long"></span>
            </div>
        </div>
    </main>

    <footer class="footer blog-post-footer">
        <p>&copy; 2026 Shaiyon. All rights reserved.</p>
    </footer>

    <script>
        function initTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            if (!themeToggle || !themeIcon) return;
            
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
                applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });
        }
        
        function applyTheme(theme) {
            const themeIcon = document.getElementById('themeIcon');
            document.body.classList.toggle('dark-mode', theme === 'dark');
            document.body.classList.toggle('light-mode', theme !== 'dark');
            if (themeIcon) themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', theme);
        }
        
        initTheme();

        const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));

        const formatDate = (value) => new Intl.DateTimeFormat('en', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        }).format(new Date(value));

        const renderNotFound = (title = 'Post not found') => {
            const container = document.getElementById('postContainer');
            container.removeAttribute('aria-busy');
            container.innerHTML = `
                <div class="post-not-found">
                    <h2>${escapeHtml(title)}</h2>
                    <p><a href="devlogs.html" class="back-link">Back to Dev Logs</a></p>
                </div>
            `;
        };

        const renderManualLog = (log) => {
            document.title = `${log.title} - Dev Log`;
            const container = document.getElementById('postContainer');
            container.removeAttribute('aria-busy');
            container.innerHTML = `
                <a href="devlogs.html" class="back-link">Back to Dev Logs</a>
                <article class="reveal-card">
                    <h2>${escapeHtml(log.title)}</h2>
                    <div class="post-meta">
                        <span class="post-date">${escapeHtml(formatDate(log.date))}</span>
                        <span class="post-author">${escapeHtml(log.project)}</span>
                    </div>
                    <div class="post-tags">
                        ${(log.tags || []).map((tag) => `<span class="blog-tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                    <p class="post-summary">${escapeHtml(log.description || '')}</p>
                    <div class="post-content">${escapeHtml(log.body || log.description || '')}</div>
                    ${(log.whatChanged || []).length ? `
                        <section class="post-section">
                            <h3>What changed</h3>
                            <ul>
                                ${log.whatChanged.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
                            </ul>
                        </section>
                    ` : ''}
                    ${(log.technicalNotes || []).length ? `
                        <section class="post-section">
                            <h3>Technical notes</h3>
                            <ul>
                                ${log.technicalNotes.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
                            </ul>
                        </section>
                    ` : ''}
                    ${(log.comments || log.notes) ? `
                        <aside class="post-notes">
                            <strong>Comments / notes</strong>
                            <p>${escapeHtml(log.comments || log.notes)}</p>
                        </aside>
                    ` : ''}
                    ${(log.links || []).length ? `
                        <div class="devlog-links">
                            ${log.links.map((link) => `<a href="${escapeHtml(link.url)}" target="${String(link.url).startsWith('http') ? '_blank' : '_self'}" rel="noopener noreferrer">${escapeHtml(link.label)}</a>`).join('')}
                        </div>
                    ` : ''}
                </article>
            `;
        };

        const renderLegacyPost = (post) => {
            document.title = `${post.title} - Portfolio`;
            const container = document.getElementById('postContainer');
            container.removeAttribute('aria-busy');
            container.innerHTML = `
                <a href="devlogs.html" class="back-link">Back to Dev Logs</a>
                <article class="reveal-card">
                    <h2>${escapeHtml(post.title)}</h2>
                    <div class="post-meta">
                        <span class="post-date">${escapeHtml(post.date)}</span>
                        <span class="post-author">By ${escapeHtml(post.author)}</span>
                        <span class="post-reading-time">${escapeHtml(post.readingTime)}</span>
                    </div>
                    <div class="post-tags">
                        ${(post.tags || []).map((tag) => `<span class="blog-tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                </article>
            `;
        };

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        document.getElementById('postContainer').setAttribute('aria-busy', 'true');

        if (postId) {
            Promise.all([
                fetch('../data/manual-devlogs.json').then((response) => response.json()),
                fetch('../data/posts.json').then((response) => response.json())
            ])
                .then(([manualData, legacyData]) => {
                    const manualLog = (manualData.logs || []).find((log) => String(log.id) === String(postId));
                    const legacyPost = (legacyData.posts || []).find((post) => String(post.id) === String(postId));

                    if (manualLog) renderManualLog(manualLog);
                    else if (legacyPost) renderLegacyPost(legacyPost);
                    else renderNotFound();
                })
                .catch(error => {
                    console.error('Error loading post:', error);
                    renderNotFound('Error loading post');
                });
        } else {
            renderNotFound();
        }

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
